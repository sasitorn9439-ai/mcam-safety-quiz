<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22104a">
<title>MCAM Safety Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="player.css">
</head>
<body>
<div class="stripe"></div>
<header class="ptop">
  <span class="pname" id="hdrName"></span>
  <span class="spacer"></span>
  <span class="pscore k" id="hdrScore"></span>
  <span class="net" id="net"><b></b><span></span></span>
</header>

<main class="pmain">
  <!-- JOIN -->
  <section id="vJoin" class="view center-v">
    <div class="logo"><i>!</i><div><h1>MCAM Safety Quiz</h1><p>ควิซความปลอดภัย</p></div></div>
    <form id="joinForm" class="card joincard" novalidate>
      <label for="inPin">Game PIN</label>
      <input id="inPin" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="123 456" pattern="[0-9 ]*">
      <label for="inName">ชื่อของคุณ · Your name</label>
      <input id="inName" autocomplete="nickname" maxlength="20" placeholder="เช่น สมชาย F3">
      <p class="err" id="joinErr" role="alert"></p>
      <button class="btn dark full" id="btnJoin" type="submit">เข้าร่วม · Join</button>
    </form>
    <a class="hostlink" href="host.html">เป็นผู้ดำเนินเกม? · Host a game →</a>
  </section>

  <!-- STATUS (connecting / lobby / ready / answered / waiting) -->
  <section id="vMsg" class="view center-v hidden">
    <div class="msg">
      <div class="big-ico" id="msgIco">⏳</div>
      <h2 id="msgTitle"></h2>
      <p id="msgSub"></p>
      <div class="bar hidden" id="msgBar"><i id="msgFill"></i></div>
      <button class="btn ghost small hidden" id="msgBtn" type="button"></button>
    </div>
  </section>

  <!-- ANSWER -->
  <section id="vAns" class="view hidden">
    <div class="ahead">
      <span class="k" id="aNum"></span>
      <div class="bar"><i id="aFill"></i></div>
      <span class="k" id="aSec"></span>
    </div>
    <div class="aq" id="aQ"></div>
    <div id="aImg" class="qimg hidden"></div>
    <div class="opts pads" id="aOpts"></div>
  </section>

  <!-- RESULT -->
  <section id="vRes" class="view center-v hidden">
    <div class="res pop" id="resBox">
      <div class="big-ico" id="resIco"></div>
      <h2 id="resTitle"></h2>
      <div class="pts k" id="resPts"></div>
      <p id="resStreak"></p>
      <p class="rank" id="resRank"></p>
      <div class="exp hidden" id="resExp"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js"></script>
<script>window.mqtt||document.write('<script src="https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"><\/script>')</script>
<script>window.mqtt||document.write('<script src="vendor/mqtt.min.js"><\/script>')</script>
<script src="common.js"></script>
<script src="quizart.js"></script>
<script src="bus.js"></script>
<script src="player.js"></script>
</body>
</html>
